<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Humagent</title>
    <link rel="stylesheet" href="/ui/css-variables.css" />
    <link rel="stylesheet" href="/ui/app.css" />
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <main aria-label="Page">
      <iframe
        id="frame"
        title="Page"
        sandbox="allow-scripts allow-forms allow-same-origin"
        allow="clipboard-write"
      ></iframe>
      <div id="connecting" role="status">Connecting to the page…</div>
    </main>
    <section
      id="bar"
      class="glass-surface"
      aria-label="Humagent bar"
      data-open="false"
    >
      <div id="notices">
        <p id="error" role="alert" hidden></p>
        <p id="update" role="status" hidden>
          The page changed. Refresh it, then check stale reviews before sending.
          <button id="reload-page" class="primary" type="button">
            Refresh page
          </button>
        </p>
      </div>
      <section
        id="details"
        aria-label="Pending feedback and agent status"
        inert
      >
        <div id="details-content">
          <section class="connection" aria-label="Agent connection">
            <div class="connection-heading">
              <h2 class="agent-status">
                <span
                  id="agent-indicator"
                  class="agent-dot"
                  aria-hidden="true"
                ></span>
                <span id="agent-state" role="status">Checking connection</span>
              </h2>
              <button
                id="end"
                class="icon"
                aria-label="End session"
                disabled
              ></button>
            </div>
            <p id="agent-hint" hidden>
              Start <code>/humagent</code> in your agent chat to connect.
            </p>
          </section>
          <h2 id="pending-count" hidden></h2>
          <ol id="pending" aria-label="Pending feedback"></ol>
        </div>
      </section>
      <div class="bar-controls">
        <button
          id="bar-toggle"
          class="icon"
          aria-label="Give feedback"
          data-tooltip="Give feedback"
          aria-pressed="false"
          aria-expanded="false"
          aria-controls="details"
        >
          <span id="toggle-icon"></span>
          <span id="toggle-dot" class="agent-dot" aria-hidden="true"></span>
          <span id="toggle-count" hidden></span>
        </button>
        <textarea
          id="instruction"
          class="feedback-input"
          aria-label="Instruction"
          rows="1"
          maxlength="4000"
          placeholder="Add an instruction…"
        ></textarea>
        <button
          id="send"
          class="primary icon"
          aria-live="polite"
          disabled
        ></button>
      </div>
      <span id="bridge-status" class="sr-only" role="status">Connecting</span>
      <span id="instruction-status" class="sr-only" role="status"></span>
    </section>
  </body>
</html>
