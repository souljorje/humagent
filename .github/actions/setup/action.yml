name: Setup
description: Install the toolchain and dependencies, and restore task results.
inputs:
  registry-url:
    description: Optional npm registry for publication.
    default: ''
  cache:
    description: Restore and save Turbo task results.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      id: node
      with:
        node-version: '24'
        registry-url: ${{ inputs.registry-url }}
    - name: Install the pinned Bun canary
      run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      shell: bash
    - run: bun run check:toolchain
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock', 'turbo.json', 'toolchain.json', 'package.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock', 'turbo.json', 'toolchain.json', 'package.json') }}-
    - run: bun install --frozen-lockfile
      shell: bash
