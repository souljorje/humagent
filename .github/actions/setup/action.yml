name: Setup
description: Install the toolchain and dependencies, and restore task results.
inputs:
  registry-url:
    description: Optional npm registry for publication.
    default: ''
  cache:
    description: Restore and save Turbo task results.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      id: node
      with:
        node-version: '24'
        registry-url: ${{ inputs.registry-url }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.4.4'
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: inputs.cache == 'true'
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-bun1.4.4-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-bun1.4.4-${{ hashFiles('bun.lock', 'turbo.json') }}-
    - run: bun install --frozen-lockfile
      shell: bash
