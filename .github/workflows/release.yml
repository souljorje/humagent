name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from package.json
        required: true
        type: string
      publish:
        description: Publish to npm and create a GitHub release
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Publish the verified archive
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: humagent-${{ inputs.version }}.tgz
          access: public
          provenance: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: humagent-${{ inputs.version }}.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
