name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' && github.repository == 'souljorje/humagent'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - id: version
        if: steps.changesets.outputs.present == 'true'
        uses: changesets/action/version@v2.1.2
        with:
          script: bun run version:packages
          commit-message: 'chore(release): version humagent'
          pr-title: 'chore(release): version humagent'
      - name: Check version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run check.yml --ref "$branch"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'souljorje/humagent'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run check:release
      - id: package
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha256sum "humagent-$version.tgz" > "humagent-$version.tgz.sha256"
          sha256sum --check "humagent-$version.tgz.sha256"
      - name: Publish verified archive
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish "humagent-${{ steps.package.outputs.version }}.tgz" --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            humagent-${{ steps.package.outputs.version }}.tgz
            humagent-${{ steps.package.outputs.version }}.tgz.sha256
          fail_on_unmatched_files: true
