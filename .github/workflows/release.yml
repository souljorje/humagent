name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version from package.json
        required: true
        type: string
      publish:
        description: Publish the tested archive to npm
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); if(p.version!==process.env.RELEASE_VERSION) throw new Error('Version does not match package.json')"
      - name: Publish the verified archive
        run: npm publish "humagent-$(node -p "require('./package.json').version").tgz" --access public --provenance
