name: Toolchain benchmarks

on:
  pull_request:
    branches: ['0.3']
    paths:
      - '.github/benchmarks/**'
      - '.github/workflows/toolchain-benchmarks.yml'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'toolchain.json'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'ui/**'
      - 'scripts/**'
      - 'test/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        suite: [tools, tests]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Save historical Bun baseline
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-bun/baseline"
          cp -L "$(command -v bun)" "$RUNNER_TEMP/toolchain-bun/baseline/bun"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - name: Save stable comparison
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-bun/stable"
          cp -L "$(command -v bun)" "$RUNNER_TEMP/toolchain-bun/stable/bun"
      - name: Install the adopted canary
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          mkdir -p "$RUNNER_TEMP/toolchain-bun/canary"
          cp -L "$(npm prefix --global)/bin/bun" "$RUNNER_TEMP/toolchain-bun/canary/bun"
          "$RUNNER_TEMP/toolchain-bun/canary/bun" scripts/toolchain.ts
          printf '%s\n' "$RUNNER_TEMP/toolchain-bun/canary" >> "$GITHUB_PATH"
      - name: Check cache evidence parsing
        run: bun test ./.github/benchmarks/cache-result.test.ts
      - name: Benchmark historical, alternative, and adopted toolchains
        run: bun .github/benchmarks/toolchain.ts ${{ matrix.suite }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: toolchain-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/toolchain-results/${{ matrix.suite }}/
          retention-days: 14
          if-no-files-found: warn
