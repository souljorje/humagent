name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install
      - run: bun run check
      - run: bunx --bun playwright-core install --with-deps chromium
      - run: bun run test:browser
      - run: bun pm pack
      - run: bun run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-verification
          path: |
            .local/*.png
            bun.lock
            humagent-*.tgz
          include-hidden-files: true
          if-no-files-found: ignore
