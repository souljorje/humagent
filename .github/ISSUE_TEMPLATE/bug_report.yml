name: Bug report
description: Report a reproducible problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use private vulnerability reporting instead. See SECURITY.md.
  - type: textarea
    attributes:
      label: What happened
      description: State the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List the exact commands and page setup.
    validations:
      required: true
  - type: input
    attributes:
      label: Humagent version
      description: Output of humagent --version.
    validations:
      required: true
  - type: input
    attributes:
      label: Runtime and OS
      description: For example Node.js 24 on macOS, or Bun 1.4.4 on Linux.
    validations:
      required: true
