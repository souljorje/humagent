  <script>
    (() => {
      document.querySelectorAll("#ch-composer [data-type]").forEach((el) => {
        el.innerHTML = [...el.dataset.type].map((c) => '<span class="ch">' + (c === " " ? " " : c) + "</span>").join("");
      });
      // Beat n of the music bed lands at B(n); see review.html.
      const B = (n) => 1.021 + 0.49988 * n;
      const tl = gsap.timeline({ paused: true });
      const lines = [...document.querySelectorAll(".ch-plan .pl span")];
      const SEND = B(5.5);

      // Reveal fixed glyphs continuously. Avoid animated clipping during export.
      let characterIndex = 0;
      lines.forEach((line) => {
        const text = line.textContent;
        line.textContent = "";
        for (const character of text) {
          const glyph = document.createElement("span");
          glyph.className = "agent-char";
          glyph.textContent = character;
          line.appendChild(glyph);
          const time = 0.35 + characterIndex * 0.0026;
          if (time < SEND) tl.set(glyph, { opacity: 1 }, time);
          characterIndex++;
        }
      });
      tl.to("#ch-scroll", { y: -116, duration: SEND - 2.7, ease: "none" }, 2.7);

      // Focus moves to the composer: the camera eases in on it and the stream blurs and dims behind it.
      tl.to("#ch-win", { scale: 1.35, y: -110, duration: 0.45, ease: "power3.inOut" }, 2.0);
      tl.to("#ch-thread", { filter: "blur(6px)", opacity: 0.35, duration: 0.4, ease: "power2.out" }, 2.0);
      tl.to("#ch-win", { scale: 1, y: 0, duration: 0.45, ease: "power3.inOut" }, SEND + 0.05);
      tl.to("#ch-thread", { filter: "blur(0px)", opacity: 1, duration: 0.35, ease: "power2.out" }, SEND + 0.05);

      // The human types over the stream and sends.
      tl.set("#ch-caret", { opacity: 1 }, 2.25);
      tl.set("#ch-ph", { display: "none" }, 2.35);
      document.querySelectorAll("#ch-composer .ch").forEach((c, i) => tl.set(c, { display: "inline" }, 2.35 + i * 0.04));
      tl.to("#ch-send", { opacity: 1, duration: 0.15 }, 2.55);
      tl.to("#ch-send", { scale: 0.88, duration: 0.07 }, SEND);
      tl.to("#ch-send", { scale: 1, opacity: 0.35, duration: 0.15 }, SEND + 0.07);
      tl.set(["#ch-t1", "#ch-t2", "#ch-t3", "#ch-caret"], { opacity: 0 }, SEND + 0.03);
      tl.set("#ch-ph", { display: "inline" }, SEND + 0.03);
      tl.fromTo("#ch-me", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, SEND + 0.03);
      // Card top (978) plus scroll lands the preview at window y 470 (frame y 566); see CARD in review.html.
      tl.to("#ch-scroll", { y: -508, duration: 0.55, ease: "power3.inOut" }, B(5.6));
      tl.fromTo("#ch-reply", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, B(6.5));

      // The preview card (the review window) opens over the chat; the chat falls back.
      tl.to("#ch-win", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power3.in" }, B(8.2));

      window.__timelines["chat"] = tl;
    })();
  </script>
