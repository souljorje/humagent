                <div class="np-opt" style="left: 360px; width: 130px">

            <div id="rv-cp2" class="cpanel glass" style="left: 48px; top: 280px">
              <div class="fi"><span class="ph" data-layout-ignore>Add a comment</span></div>
              <div class="pbtn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6" /></svg>
              </div>

            <div id="rv-bar-wrap" data-layout-allow-occlusion>
              <div id="rv-bar" class="glass">
                <div id="rv-tray">
                  <div class="st">
                    <span id="rv-dot"></span>

                  </div>
                  <div id="rv-msg" class="fi"><span id="rv-msg-ph" class="ph" data-layout-ignore>Add an instruction</span><span id="rv-msg-text" data-type="Use Lagoon for all accents"></span><span id="rv-msg-caret" class="caret"></span><span id="rv-msg-ring"></span></div>
                  <div id="rv-send" class="ib">
                    <svg id="rv-arrowup" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
                    <svg id="rv-spin" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.56" /></svg>

            <div id="rv-cursor">
              <svg id="rv-arrow" viewBox="0 0 26 26" width="26" height="26">
                <path d="M3 2 L3 21 L8 16.4 L11.4 24 L14.6 22.6 L11.3 15.2 L18 15.2 Z" fill="#111111" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
              </svg>
              <svg id="rv-ibeam" viewBox="0 0 14 28" width="14" height="28">
                <path d="M3 2h4M7 2v24M3 26h8M7 2h4" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                <path d="M3 2h4M7 2v24M3 26h8M7 2h4" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </div>
          </div>

      </div>

  </div>

  <script>
    (() => {
      // Split typed strings into hidden characters.
      document.querySelectorAll("[data-type]").forEach((el) => {
        el.innerHTML = [...el.dataset.type].map((c) => '<span class="ch">' + (c === " " ? "&nbsp;" : c) + "</span>").join("");
      });

      // The music clock: assets/bgm/track.wav (120 BPM) starts at 1.0 s, so beat n of the track lands at B(n).
      // Breaks: B(14)-B(16) and B(30)-B(32). The film ends at B(53) with the music fading out.
      const B = (n) => 1.021 + 0.49988 * n;

      // Camera: focus a screen point (CSS px) at scale s, clamped to the screen edges.
      const VW = 1600, VH = 810, SW = 1280, SH = 648;
      const cam = (cx, cy, s) => ({
        x: Math.min(0, Math.max(VW - SW * s, VW / 2 - cx * s)),
        y: Math.min(0, Math.max(VH - SH * s, VH / 2 - cy * s)),
        scale: s,
      });
      const C0 = cam(640, 324, 1.25); // the whole screen
      const CQ = cam(976, 364, 1.45); // the whole poster, the agent's question under it, and the bar
      const C1 = cam(400, 335, 2.0); // headline, button, comment panel
      const C2 = cam(330, 215, 1.9); // headline
      const C4 = cam(1034, 431, 1.95); // the bar, expanded (terminal.html mirrors these numbers)
      const C5 = cam(1034, 560, 1.9); // the bar while the agent works

      // Bar clip states, measured from the bar's top edge (CSS px).
      const CLIP = { closed: 344, status: 298, open: 0 };
      const clip = (top) => "inset(" + top + "px 0px 0px 0px round 24px)";
      // The chat's preview card (chat.html) is this window at 0.26 scale.
      const CARD = { x: 240, y: 526, scale: 0.26 };

      const tl = gsap.timeline({ paused: true });
      const ease = { cam: "power3.inOut", in: "expo.out", out: "power3.in" };

      gsap.set("#rv-win", { ...CARD, opacity: 0 });
      gsap.set("#rv-cam", C0);
      gsap.set("#rv-cursor", { x: 700, y: 330, opacity: 0 });
      gsap.set("#np-dot", { scale: 0 });
      gsap.set("#rv-bar", { clipPath: clip(CLIP.closed) });

      const click = (t) => {
        tl.to("#rv-arrow", { scale: 0.86, duration: 0.07, ease: "power2.out" }, t);
        tl.to("#rv-arrow", { scale: 1, duration: 0.14, ease: "power2.out" }, t + 0.07);
      };
      const move = (x, y, t, d) => tl.to("#rv-cursor", { x, y, duration: d, ease: "power2.inOut" }, t);
      const camTo = (c, t, d) => tl.to("#rv-cam", { ...c, duration: d, ease: ease.cam }, t);
      const type = (sel, t0, dt) => {
        document.querySelectorAll(sel + " .ch").forEach((c, i) => tl.set(c, { display: "inline" }, t0 + i * dt));
      };
      const openPanel = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, y: 6, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: ease.in }, t);
      const closePanel = (sel, t) => tl.to(sel, { opacity: 0, y: 4, duration: 0.15, ease: ease.out }, t);
      const marker = (sel, t) =>
        tl.fromTo(sel, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: ease.in }, t);
      const barClip = (from, to, t, d, e) =>
        tl.fromTo("#rv-bar", { clipPath: clip(from) }, { clipPath: clip(to), duration: d, ease: e, immediateRender: false }, t);

      // 0. The agent's preview card appears in the chat, then opens into the page.
      tl.to("#rv-win", { opacity: 1, duration: 0.25, ease: ease.in }, B(7));
      tl.fromTo("#rv-win", { scale: 0.24 }, { scale: CARD.scale, duration: 0.35, ease: ease.in, immediateRender: false }, B(7));
      tl.to("#rv-win", { x: 0, y: 0, scale: 1, duration: B(9.5) - B(8), ease: ease.cam }, B(8));

      // 1. Answer the agent's question. Commenting is off: the page works as usual.
      tl.to("#rv-cursor", { opacity: 1, duration: 0.15 }, B(9.6));
      camTo(CQ, B(9.5), B(11) - B(9.5));
      move(963, 492, B(9.6), 0.85);
      click(B(11.5));
      tl.to("#np-ring", { opacity: 1, duration: 0.12 }, B(11.5) + 0.02);
      tl.to("#np-dot", { scale: 1, duration: 0.22, ease: ease.in }, B(11.5) + 0.02);
      tl.to("#rv-send", { opacity: 1, duration: 0.2 }, B(11.5) + 0.04);

      // 2. Turn commenting on, then comment on the button. Enter confirms on the drop.
      move(875, 603, B(11.75), 0.33);
      click(B(12.5));
      tl.to("#rv-annot-bg", { opacity: 1, duration: 0.12 }, B(12.5) + 0.02);
      tl.to("#rv-annot-ic", { stroke: "#222222", duration: 0.12 }, B(12.5) + 0.02);
      camTo(C1, B(12.75), B(14) - B(12.75));
      move(160, 404, B(12.75), 0.6);
      tl.to("#rv-hl-btn", { opacity: 1, duration: 0.1 }, B(13.85));
      click(B(14));
      openPanel("#rv-cp1", B(14) + 0.02);
      tl.set("#rv-ph1", { opacity: 0 }, B(14.45));
      type("#rv-c1", B(14.45), 0.028);
      closePanel("#rv-cp1", B(16));
      tl.to("#rv-hl-btn", { opacity: 0, duration: 0.12 }, B(16));
      marker("#rv-m1", B(16) + 0.02);

      // 3. Rewrite the headline in place. Enter confirms.
      camTo(C2, B(16.5), B(18) - B(16.5));
      move(52, 236, B(16.25), 0.8);
      tl.set("#rv-arrow", { opacity: 0 }, B(17.65));
      tl.set("#rv-ibeam", { opacity: 1 }, B(17.65));
      tl.set("#rv-sel", { opacity: 1, scaleX: 0 }, B(18));
      tl.to("#rv-sel", { scaleX: 1, duration: B(19) - B(18), ease: "power1.inOut" }, B(18));
      tl.to("#rv-cursor", { x: 606, duration: B(19) - B(18), ease: "power1.inOut" }, B(18));
      tl.to("#rv-hl-h1", { opacity: 1, duration: 0.1 }, B(19.25));
      openPanel("#rv-cp2", B(19.25));
      tl.set("#rv-sel", { opacity: 0 }, B(19.45));
      tl.set("#np-old", { display: "none" }, B(19.45));
      tl.set("#np-caret", { opacity: 1 }, B(19.45));
      type("#np-new", B(19.45), 0.035);
      closePanel("#rv-cp2", B(20.5));
      tl.to("#rv-hl-h1", { opacity: 0, duration: 0.12 }, B(20.5));
      tl.set("#np-caret", { opacity: 0 }, B(20.5));
      marker("#rv-m2", B(20.5) + 0.02);
      tl.set("#rv-ibeam", { opacity: 0 }, B(20.55));
      tl.set("#rv-arrow", { opacity: 1 }, B(20.55));

      // 4. Open the drafts, then type a short note right before sending on the break.
      camTo(C4, B(21), B(22.5) - B(21));
      move(833, 603, B(20.75), 0.9);
      click(B(23));
      barClip(CLIP.closed, CLIP.open, B(23) + 0.02, 0.45, ease.in);
      tl.to("#rv-tray", { opacity: 1, duration: 0.2 }, B(23) + 0.02);
      tl.to("#rv-chev", { rotation: 180, duration: 0.3, ease: ease.cam }, B(23) + 0.02);
      ["#rv-dhead", "#rv-d1", "#rv-d2", "#rv-d3"].forEach((sel, i) =>
        tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: ease.in }, B(23.5 + i * 0.5)),
      );
      move(1010, 603, B(25.3), 0.35);
      click(B(26));
      tl.to("#rv-msg-ring", { opacity: 1, duration: 0.1 }, B(26) + 0.02);
      tl.set("#rv-msg-caret", { opacity: 1 }, B(26) + 0.02);
      tl.set("#rv-msg-ph", { opacity: 0 }, B(26.2));
      type("#rv-msg-text", B(26.2), 0.034);
      move(1235, 603, B(29.05), 0.4);
      tl.to("#rv-msg-ring", { opacity: 0, duration: 0.1 }, B(30));
      tl.set("#rv-msg-caret", { opacity: 0 }, B(30));
      click(B(30));
      tl.to("#rv-arrowup", { opacity: 0, duration: 0.08 }, B(30) + 0.02);
      tl.to("#rv-spin", { opacity: 1, duration: 0.08 }, B(30) + 0.02);
      tl.fromTo("#rv-spin", { rotation: 0 }, { rotation: 360, duration: B(32) - B(30), ease: "none" }, B(30) + 0.02);
      // The values and the note leave the bar: terminal.html carries copies of them into the JSON.
      tl.to(["#rv-d1 .dx", "#rv-d1 .dv span:last-child", "#rv-d2 .dx", "#rv-d3 .dx", "#rv-msg-text"], { opacity: 0, duration: 0.08 }, B(30));

      // 5. The terminal covers the frame from B(32). Set the sent state under it.
      const SENT = B(32) + 0.15;
      tl.set("#rv-cam", C5, SENT);
      tl.set("#rv-cursor", { opacity: 0 }, SENT);
      tl.set(["#rv-m1", "#rv-m2"], { opacity: 0 }, SENT);
      tl.set(["#rv-dhead", "#rv-d1", "#rv-d2", "#rv-d3"], { display: "none" }, SENT);
      tl.set("#rv-bar", { clipPath: clip(CLIP.status) }, SENT);
      tl.set("#rv-st-listen", { opacity: 0 }, SENT);
      tl.set("#rv-st-work", { opacity: 1 }, SENT);
      tl.set("#rv-dot", { backgroundColor: "#60a5fa" }, SENT);
      tl.set("#rv-spin", { opacity: 0 }, SENT);
      tl.set("#rv-arrowup", { opacity: 1 }, SENT);
      tl.set("#rv-send", { opacity: 0.42 }, SENT);
      tl.set("#rv-msg-ph", { opacity: 1 }, SENT);
      // The terminal is opaque and full-frame until B(37): hide the page under it, show it before the terminal shrinks.
      tl.set("#rv-win", { opacity: 0 }, SENT);
      tl.set("#rv-win", { opacity: 1 }, B(37) - 0.02);

      // 6. The agent works. The page reloads with the changes, the agent listens again, the camera pulls back.
      tl.to("#rv-page", { opacity: 0, duration: 0.08, ease: "power2.in" }, B(39));
      tl.set("#np-lagoon", { opacity: 1 }, B(39) + 0.08);
      tl.set("#rv-page", {
        "--accent-start": "#087e79",
        "--accent-end": "#086f8e",
        "--accent-light": "#6fe6cf",
        "--accent-glow": "rgba(20, 179, 166, 0.18)",
        "--accent-wash": "rgba(20, 179, 166, 0.12)",
      }, B(39) + 0.08);
      tl.set(".np-signin", { backgroundColor: "#087e79" }, B(39) + 0.08);
      tl.set("#np-btns2 .np-line", { color: "#087e79", boxShadow: "0 0 0 1px #87cfc5" }, B(39) + 0.08);
      tl.set("#np-btns1", { opacity: 0 }, B(39) + 0.08);
      tl.set("#np-btns2", { opacity: 1 }, B(39) + 0.08);
      tl.fromTo(
        "#rv-page",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: ease.in, immediateRender: false },
        B(39) + 0.1,
      );
      tl.to("#rv-dot", { backgroundColor: "#4ade80", duration: 0.2 }, B(40));
      tl.to("#rv-st-work", { opacity: 0, duration: 0.12 }, B(40));
      tl.to("#rv-st-listen", { opacity: 1, duration: 0.12 }, B(40) + 0.04);
      camTo(C0, B(40), B(42) - B(40));
      barClip(CLIP.status, CLIP.closed, B(43), 0.35, ease.cam);
      tl.to("#rv-tray", { opacity: 0, duration: 0.2 }, B(43));
      tl.to("#rv-chev", { rotation: 0, duration: 0.3, ease: ease.cam }, B(43));

      // 7. Hand the bar to the end card and let the window fall back.
      tl.set("#rv-bar-wrap", { opacity: 0 }, B(44));
      tl.to("#rv-win", { opacity: 0, scale: 0.96, x: 32, y: 17, filter: "blur(8px)", duration: 0.45, ease: ease.out }, B(44));

      window.__timelines["review"] = tl;
    })();
  </script>
