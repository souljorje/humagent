  <script>
    (() => {
      // Local time of music beat n. This scene starts at B(29.5) = 15.767 s; see review.html.
      const L = (n) => 0.49988 * (n - 29.5);

      // The bar's top-left at the send framing (C4 in review.html): 160 + (-896 + 804 * 1.95), 76 + (-435.45 + 230 * 1.95).
      const REP = { x: 831.8, y: 89.05, scale: 1.95 };
      // The bar's rect as a transform of the full-frame card. Radii are divided by scale to stay round.
      const FROM = { x: 831.8, y: 89.05, scaleX: 0.46719, scaleY: 0.72583, borderRadius: "100.17px / 64.48px" };
      const FULL = { x: 0, y: 0, scaleX: 1, scaleY: 1, borderRadius: "0px / 0px" };
      const BACK = { x: 855.6, y: 658, scaleX: 0.455208, scaleY: 0.182963, borderRadius: "100.17px / 249.23px" };

      // Layout offsets (ignore transforms), summed up to a stop element.
      const offset = (el, stop) => {
        let x = 0, y = 0;
        while (el && el !== stop) {
          x += el.offsetLeft;
          y += el.offsetTop;
          el = el.offsetParent;
        }
        return { x, y };
      };
      // The runtime hides a scene outside its window (display: none), which zeroes every offset.
      // Show hidden ancestors for the measurement only, then restore their inline display.
      const shown = (els, fn) => {
        const hidden = [];
        for (const start of els) {
          for (let el = start; el && el.nodeType === 1; el = el.parentElement) {
            if (getComputedStyle(el).display === "none" && !hidden.some((h) => h.el === el)) {
              hidden.push({ el, display: el.style.display });
              el.style.display = "block";
            }
          }
        }
        try {
          return fn();
        } finally {
          hidden.forEach(({ el, display }) => (el.style.display = display));
        }
      };
      const rep = document.querySelector("#tm-rep");
      const host = document.querySelector("#tm-host");
      // Crossfade font layers while moving, then swap identical glyphs at rest.
      for (let i = 0; i <= 5; i++) {
        const fly = document.querySelector("#tf-" + i);
        const source = document.createElement("span");
        source.className = "source";
        source.textContent = fly.textContent;
        const code = document.createElement("span");
        code.className = "code";
        code.textContent = document.querySelector("#tj-" + i).textContent;
        fly.replaceChildren(source, code);
      }
      // Measure the target span itself to align line boxes precisely.
      const cache = {};
      const target = (i) => cache[i] || (cache[i] = measure(i));
      const measure = (i) => {
        const fly = document.querySelector("#tf-" + i);
        const tv = document.querySelector("#tj-" + i);
        const { from, to } = shown([fly, tv], () => ({
          from: offset(fly, rep),
          to: offset(tv, host),
        }));
        return {
          x: (to.x - REP.x) / REP.scale - from.x,
          y: (to.y - REP.y) / REP.scale - from.y,
        };
      };

      const tl = gsap.timeline({ paused: true });
      gsap.set("#tm-rep", REP);

      // Send: the values lift off the bar during the break.
      tl.to(".fly", { opacity: 1, duration: 0.08 }, L(30));
      tl.to(".fly", { y: -2, duration: L(31.2) - L(30), ease: "power2.out" }, L(30));

      // The bar grows into the frame and fills it on the drop.
      tl.to("#tm-card", { opacity: 1, duration: 0.1 }, L(31));
      tl.fromTo("#tm-card", FROM, { ...FULL, duration: L(32) - L(31), ease: "power3.in", immediateRender: false }, L(31));
      tl.fromTo(
        "#tm-body .jl",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.out" },
        L(32),
      );

      // The instruction dissolves with the panel instead of crossing every feedback row.
      tl.to("#tf-0", { opacity: 0, duration: 0.18, ease: "power2.in" }, L(31));
      tl.fromTo("#tj-0", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.out" }, L(32));

      // Stagger the remaining flights and hand over after landing.
      for (let i = 1; i <= 5; i++) {
        const t = L(31.6) + (i - 1) * 0.06;
        const duration = 0.72;
        tl.to("#tf-" + i, {
          x: () => target(i).x,
          y: () => target(i).y,
          scale: 2 / REP.scale,
          duration,
          ease: "power3.inOut",
        }, t);
        tl.to("#tf-" + i + " .source", { opacity: 0, duration: 0.1, ease: "power2.in" }, t + 0.24);
        tl.to("#tf-" + i + " .code", { opacity: 1, duration: 0.12, ease: "power2.out" }, t + 0.34);
        tl.set("#tf-" + i, { opacity: 0 }, t + duration);
        tl.set("#tj-" + i, { opacity: 1 }, t + duration);
      }

      // Back into the bar.
      tl.to("#tm-body", { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, L(37));
      tl.fromTo("#tm-card", FULL, { ...BACK, duration: L(38) - L(37), ease: "power3.inOut", immediateRender: false }, L(37));
      tl.to("#tm-card", { opacity: 0, duration: 0.12 }, L(38) - 0.06);

      window.__timelines["terminal"] = tl;
    })();
  </script>
